<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>设备级流式统计验证</title>
<style>body{background:#101923;color:#e5edf4;font:16px system-ui;max-width:960px;margin:32px auto;padding:0 24px}h1{font-size:26px}small,.muted{color:#9ab1c5}.card{padding:22px;margin:16px 0;background:#1a2937;border-radius:14px}.bar{height:14px;background:#34485b;border-radius:8px;overflow:hidden}.fill{height:100%;background:#59d4b2;transition:width .5s}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:10px;border-bottom:1px solid #34485b}.good{color:#74e4b1}.bad{color:#ff9292}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:13px monospace}#detail{font-size:14px}</style>
<h1>设备级流式统计 · 小切片与资源验证</h1><p class="muted">1 CPU · 8 GiB · 预检 5 分钟 + 完整检查 25 分钟上限（不含排队）<br>通过后自动封存训练方案；本轮不提交训练。原包与检查点保存在超算。</p>
<div class="card"><strong id="state">正在读取进度…</strong><p id="detail"></p><div class="bar"><div id="fill" class="fill" style="width:0"></div></div><p id="numbers"></p><small id="fresh"></small></div>
<div class="card"><table><thead><tr><th>阶段</th><th>作业</th><th>状态</th></tr></thead><tbody id="jobs"></tbody></table></div>
<div class="card"><strong>验收项目</strong><p>独立计算一致性 · 时间戳倒退与同刻包 · 捕获边界重置 · 断点恢复 · 高并发状态上限 · 空闲清理 · 内存及吞吐</p><div id="result"></div></div>
<script>
const $=x=>document.getElementById(x);const names={WAITING_UPLOAD:'等待交付',PREFLIGHT_SUBMITTED:'预检已提交，等待调度',PREFLIGHT_RUNNING:'Linux 真实小切片预检中',FULL_SUBMITTED:'预检通过，资源检查已提交',FULL_RUNNING:'完整时钟与资源检查中',PASS:'检查通过，训练方案已封存',STOP:'已停止：需要处理'};
async function update(){try{let d=await(await fetch('/state',{cache:'no-store'})).json(),s=d.REMOTE_STATE||{},c=d.CONNECTION||{},phase=s.phase||'PREFLIGHT',p=s[phase+'_PROGRESS']||{},done=p.done||0,total=p.total||1; $('state').textContent=names[s.stage]||'等待已建立的超算通道';$('state').className=s.stage==='STOP'?'bad':s.stage==='PASS'?'good':'';
$('detail').textContent=(p.stage||'尚无运行回执')+(s.error?' · '+s.error:'');$('fill').style.width=(s.stage==='PASS'?100:Math.min(100,100*done/total))+'%';$('numbers').textContent=done.toLocaleString()+' / '+total.toLocaleString()+'（当前阶段）'+(p.frames_per_second?' · '+Math.round(p.frames_per_second).toLocaleString()+' 帧/秒':'')+(p.rss_mib?' · '+p.rss_mib.toFixed(1)+' MiB':'');$('fresh').textContent='最近同步：'+(s.observed_utc||c.utc||'等待')+' · '+(c.status||'')+'；由普通程序持续更新';
$('jobs').replaceChildren();for(let q of ['PREFLIGHT','FULL']){let tr=document.createElement('tr');for(let v of [q==='PREFLIGHT'?'真实小切片':'资源与一致性检查',s[q+'_JOB']?.job_id||'未提交',d[q+'_RESULT']?.status||s[q+'_SCHEDULER']?.stdout?.split('\n')[0]||'等待']){let td=document.createElement('td');td.textContent=v;tr.append(td)}$('jobs').append(tr)}
let result=d.FULL_RESULT,freeze=d.TRAINING_FREEZE_RECEIPT,accepted=d.ARTIFACT_ACCEPTANCE;$('result').textContent=result?'结果：'+result.status+'；合成流吞吐 '+Math.round(result.stress.events_per_second).toLocaleString()+' 包/秒；验证查询 '+Object.values(result.roles).reduce((a,r)=>a+r.oracle.queries_checked,0)+' 条；方案封存 '+(freeze?.status||'等待')+'；本地回执校验 '+(accepted?.status||'等待'):'尚无最终验收；不表示训练效果已改善。';if(accepted?.status==='FAIL'){$('state').textContent='回执验收失败，不能视为通过';$('state').className='bad'}}catch(e){$('fresh').textContent='本地进度服务暂不可达：'+e.message}}
update();setInterval(update,5000);
</script></html>
