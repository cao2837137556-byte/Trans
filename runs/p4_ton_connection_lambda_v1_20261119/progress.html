<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Paper04 · ToN 连接级回放</title>
<style>:root{color-scheme:light dark;font:15px/1.65 "Segoe UI","Microsoft YaHei",sans-serif}main{max-width:740px;margin:32px auto;padding:0 18px}h1{font-size:27px;border-bottom:2px solid #368575}h2{font-size:18px}section{border:1px solid #78978c;padding:12px 16px;margin:14px 0;border-radius:6px}textarea{width:100%;box-sizing:border-box}button{font:inherit;padding:4px 12px;cursor:pointer}small{opacity:.8}a{color:inherit}progress{width:100%}</style>
<main><h1>ToN 密码攻击 · 连接级缓存回放</h1><section><h2 id="status">读取进度</h2><p id="detail"></p><progress hidden id="bar"></progress><p id="job"></p><small id="time"></small></section>
<section hidden id="manual"><h2>在已登录的超算终端启动本轮接收端</h2><textarea id="cmd" rows="3" readonly></textarea><button id="copy">复制启动命令</button></section>
<section hidden id="done"><a href="/paper">论文回传结论</a> · <a href="/sweep">λ 配对表</a> · <a href="/receipt">本地验收</a></section></main>
<script>const el=id=>document.getElementById(id);const names={PREP:'本地核验与准备',WAITING_TERMINAL:'等待本轮接收端',WAITING_SSH:'等待已有超算连接',READY:'接收端已连通，正在核验实验包',STARTING_CLIENT:'启动交付程序',UPLOADING:'正在交付封存输入',INSTALLED:'超算已安装实验包',SUBMITTED:'已提交',VALIDATE_SUBMISSION:'核验提交条件',PENDING:'排队中',RUNNING:'运行中',COMPLETED:'已完成',COMPLETE:'超算已完成，等待回传',VERIFYING_RETURN:'正在核验回传',ACCEPTED:'结果已在 D 盘验收',STOP:'超算流程停止',LOCAL_STOP:'本地流程停止',CONNECTION_PAUSED:'等待已有隧道恢复'};
async function update(){try{const s=await(await fetch('/state',{cache:'no-store'})).json(),c=s.remote?.chain||{},p=s.remote?.progress||{};el('status').textContent=(c.phase==='formal'?'正式评价 · ':c.phase==='preflight'?'真实切片预检 · ':'')+(names[s.stage]||s.stage);el('detail').textContent=s.error||c.error||s.note||(p.phase===c.phase?p.description:'')||'';el('job').textContent=c.job_id?'Slurm 作业 '+c.job_id:'';el('time').textContent='最近更新　'+new Date(s.updated_unix*1000).toLocaleString();el('bar').hidden=s.stage!=='RUNNING'||p.phase!==c.phase||!p.total;if(!el('bar').hidden){el('bar').max=p.total;el('bar').value=p.done}el('manual').hidden=!['PREP','WAITING_SSH','WAITING_TERMINAL'].includes(s.stage);if(!el('manual').hidden&&!el('cmd').value)el('cmd').value=(await(await fetch('/start')).text()).trim();el('done').hidden=s.stage!=='ACCEPTED';}catch{el('status').textContent='无法读取本地状态'}}
el('copy').onclick=async()=>{try{await navigator.clipboard.writeText(el('cmd').value);el('copy').textContent='已复制'}catch{el('cmd').select();el('copy').textContent='已选中，可按 Ctrl+C'}};update();setInterval(update,5000)</script></html>
