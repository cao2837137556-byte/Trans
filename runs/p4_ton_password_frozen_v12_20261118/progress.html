<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Paper04 · ToN-IoT 密码攻击诊断</title><style>
:root{color-scheme:light dark;font:15px/1.65 "Segoe UI","Microsoft YaHei",sans-serif;color:#213b3b;background:#eef4f3}main{max-width:760px;margin:24px auto;padding:0 18px}header{border-bottom:2px solid #237366}h1{font-size:26px;margin:4px 0 12px}h2{font-size:18px;margin:0 0 6px}section{padding:16px 18px;background:white;border:1px solid #d5dfdc;border-radius:6px;margin-top:16px}small{color:#526e69}table{width:100%;border-collapse:collapse}td,th{text-align:left;border-bottom:1px solid #d4dedd;padding:6px 1px}textarea{box-sizing:border-box;width:100%;font:12px/1.55 Consolas,monospace}button{background:#165d53;color:white;border:0;padding:7px 14px;border-radius:4px;cursor:pointer}a{color:#17695c}progress{width:100%;accent-color:#197266}[hidden]{display:none!important}@media(prefers-color-scheme:dark){:root{color:#e3eeee;background:#192422}section{background:#22322e;border-color:#405950}small,a{color:#a3ccbc}}
</style><main><header><small>Paper04 · 冻结 v12</small><h1>ToN-IoT 密码攻击诊断</h1></header>
<section><h2 id="status">正在读取状态</h2><p id="info"></p><progress id="bar" hidden></progress><table><thead><tr><th>阶段</th><th>作业</th><th>状态</th></tr></thead><tbody id="jobs"></tbody></table><small id="updated"></small></section>
<section id="terminal" hidden><h2>在已登录的超算终端启动接收程序</h2><textarea id="command" rows="3" readonly aria-label="启动命令"></textarea><button id="copy">复制启动命令</button></section>
<section id="results" hidden><h2>已核验的结果</h2><a href="/paper">论文回传</a> · <a href="/raw">按目标的基础头结果</a> · <a href="/paired">CCNR 配对</a> · <a href="/receipt">D 盘验收回执</a></section></main>
<script>
const e=x=>document.getElementById(x), names={preflight:'真实切片预检',prepare:'封存完整查询与参考',encode:'冻结通信编码',evaluate:'基础头及 CCNR 评价'};
const words={LOCAL_CHECKS:'超算接收端已连通，正在本地核验',PREPARING:'本地核验与准备',WAITING_TERMINAL:'等待超算端接收程序',WAITING_SSH:'等待已有超算隧道',UPLOADING:'正在上传实验包',VERIFY_INPUTS:'核对超算已有文件',AWAITING_EXISTING_ASSETS:'正在交付本地已有文件',INSTALLED:'实验包已安装',SUBMITTED:'已提交',RUNNING:'运行中',PENDING:'排队中',COMPLETED:'已完成',COMPLETE:'超算流程已完成',ACCEPTED:'结果已在 D 盘验收',STOP:'流程停止',LOCAL_STOP:'本地流程停止',CONNECTION_PAUSED:'等待已有通道恢复',VERIFYING_RETURN:'正在回传并核验',WAIT:'待前序通过'};
async function update(){try{const s=await(await fetch('/state',{cache:'no-store'})).json(),c=s.remote?.chain||{},p=c.progress||{},states=c.tasks||{};
e('status').textContent=words[s.stage]||s.stage;e('info').textContent=s.error||c.error||s.note||p.description||'';
e('bar').hidden=!p.total;if(p.total){e('bar').max=p.total;e('bar').value=p.done;}
e('jobs').replaceChildren();for(let [k,n] of Object.entries(names)){let v=states[k]||{},tr=document.createElement('tr');for(const a of [n,v.job_id||'—',words[v.state]||v.state||(k==='preflight'?(s.stage==='LOCAL_CHECKS'?'等待本地核验':s.stage==='AWAITING_EXISTING_ASSETS'?'等待输入交付':'待提交'):'等待前序通过')]){let td=document.createElement('td');td.textContent=a;tr.append(td);}e('jobs').append(tr);}
e('updated').textContent='最近更新　'+new Date(s.updated_unix*1000).toLocaleString();e('terminal').hidden=!['PREPARING','WAITING_TERMINAL','WAITING_SSH'].includes(s.stage);if(!e('terminal').hidden&&!e('command').value){let r=await fetch('/start');if(r.ok)e('command').value=(await r.text()).trim();}e('results').hidden=s.stage!=='ACCEPTED';}catch{e('status').textContent='暂时无法读取本地状态';}}
e('copy').onclick=async()=>{try{await navigator.clipboard.writeText(e('command').value);e('copy').textContent='已复制';}catch{e('command').select();e('copy').textContent='已选中，可按 Ctrl+C';}};update();setInterval(update,5000);
</script></html>
