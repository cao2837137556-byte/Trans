<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>设备统计融合 · 源域与训练进度</title><style>body{background:#101923;color:#e5edf4;font:16px system-ui;max-width:900px;margin:32px auto;padding:0 24px}.card{padding:22px;margin:16px 0;background:#1a2937;border-radius:14px}h1{font-size:25px}.muted{color:#9ab1c5}.bar{height:14px;background:#34485b;border-radius:8px;overflow:hidden}.fill{height:100%;background:#59d4b2}pre{white-space:pre-wrap;overflow-wrap:anywhere}li{margin:12px 0}</style>
<h1>设备统计融合 · 源域与训练进度</h1><p class="muted">复用封存 D1 流式统计和原编码器 · 大文件与模型保存在超算</p>
<div class="card"><strong id="stage">正在读取…</strong><p id="file"></p><div class="bar"><div id="fill" class="fill"></div></div><p id="detail"></p><small id="time" class="muted"></small></div>
<div class="card"><strong>执行顺序</strong><ol><li>超算资产复用与缺失文件补齐</li><li>原包 SHA、设备归属、FIT/CAL/开发集 UID 与权重核对</li><li>完整 8 维特征构建与恢复、一致性检查</li><li>真实训练小切片与预算准入</li><li>通过前置门后，顺序训练 REFIT782 / STATS8 / FUSION790</li><li>源域校准、A/B 防退化与 Edge 诊断评价</li></ol><p id="meta"></p><p id="acceptance"></p><p class="muted">旧 782 维为冻结锚点。准备中、已提交、运行中和已验收分别报告；工程通过不等于检测效果改善。</p></div>
<script>const $=s=>document.getElementById(s);const labels={HPC_ASSET_INVENTORY:'检查超算可复用资产',LOCAL_SHA_BEFORE_UPLOAD:'补传前核验本地 SHA',ASSET_UPLOAD:'补传超算缺失资产',ASSETS_STAGED_PENDING_ADMISSION:'资产已就位，等待完整准入检查',ADMISSION_SUBMITTED:'源域准入已提交',ADMISSION_RUNNING:'源域准入运行中',ASSET_SHA:'逐项核对超算资产 SHA',FEATURE_PREFLIGHT_SUBMITTED:'真实特征小切片已提交',FEATURE_PREFLIGHT_RUNNING:'真实特征小切片运行中',FEATURE_BUILD_SUBMITTED:'完整特征构建已提交',FEATURE_BUILD_RUNNING:'完整特征构建运行中',SOURCE_FEATURES_READY:'源域特征门通过，等待真实训练准入',PREFLIGHT_SUBMITTED:'真实训练预检已提交',PREFLIGHT_RUNNING:'真实训练预检运行中',LINUX_ADAPTER_INVARIANCE:'核对 Linux 训练配方一致性',LOAD_SOURCE:'核对训练输入与归一化',TRAINING_COMPLETE:'九个新头及源域校准已完成，待A/B与Edge评价',STOP:'已停止，需要处理'};async function update(){try{let d=await(await fetch('/state',{cache:'no-store'})).json(),p=d.PROGRESS||{},s=d.CHAIN_STATE||{};$('stage').textContent=labels[p.stage]||p.stage||'准备源域核对';$('file').textContent=p.error||[(p.file||p.capture||''),(p.phase||''),(p.job_id?'作业 '+p.job_id:'')].filter(Boolean).join(' · ');let done=p.done||0,total=p.total||1;$('fill').style.width=Math.min(100,100*done/total)+'%';$('detail').textContent=(p.total?(p.stage==='ASSET_UPLOAD'||p.stage==='LOCAL_SHA_BEFORE_UPLOAD'?((done/2**30).toFixed(2)+' / '+(total/2**30).toFixed(2)+' GiB'):(done.toLocaleString()+' / '+total.toLocaleString()+'（当前阶段）')):'')+(p.bytes_per_second?' · '+(p.bytes_per_second/2**20).toFixed(2)+' MiB/s':'')+(p.reuse_candidates!==undefined?' · 可复用候选 '+p.reuse_candidates+' 项':'');if(p.version?.startsWith('HEAD_')){$('detail').textContent+=' · 正式训练完成 '+(s.completed_heads||0)+'/9'+(p.rss_mib?' · 内存 '+p.rss_mib.toFixed(0)+' MiB':'');if(s.runtime_forecast?.forecasts)$('detail').textContent+=' · 最慢单头预算预测 '+Math.ceil(Math.max(...Object.values(s.runtime_forecast.forecasts))/60)+' 分钟'}$('time').textContent='最近更新：'+(p.updated_utc||'等待');$('meta').textContent=d.METADATA_ADMISSION?'样本身份核对：'+d.METADATA_ADMISSION.status:'样本身份核对：进行中';$('acceptance').textContent=d.FINAL_ACCEPTANCE?.scope==='SOURCE_FEATURES_ONLY'?'完整源特征已验收：1,094,929 行 · 12分07秒 · 峰值212 MiB。本轮九头和源校准已验收：869,040次更新，三组集成加权误报均≤1%；A/B与Edge效果待评价。':''}catch(e){$('time').textContent='本地页面服务暂不可达'}}update();setInterval(update,5000)</script></html>
