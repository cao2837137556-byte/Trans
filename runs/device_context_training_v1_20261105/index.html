<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>作者固定参数：基线训练与统一评价</title><style>body{background:#101923;color:#e5edf4;font:16px system-ui;margin:28px;max-width:1150px}p{line-height:1.7}article{padding:15px;margin:14px 0;background:#1a2938;border-radius:10px}progress{width:100%;height:20px}.hint{color:#bdc9d4}h1{font-size:26px}pre{white-space:pre-wrap}</style><h1>作者固定参数：基线训练与统一评价</h1><p>主模型冻结 · 无超参数搜索 · 大工件留超算</p><h2 id="stage">准备交付</h2><p id="detail"></p><progress id="overall" max="6" value="0"></progress><p>真实链路与资源检查 → 自动正式训练（三种子）→ 独立CAL校准 → A / B / Edge统一评价</p><p class="hint">固定六个：DTE-C / SLAD / CatBoost / TabM / TabR / Disent-AD。ModernNCA已取消。后三方法各自整轮资源检查通过后，自动接正式训练、校准、评价。GPU任务上限7天，实际完成即释放。</p><div id="methods"></div><h2>其他基线：待完成资格检查</h2><div id="pending"></div><p id="updated"></p><script>const $=x=>document.getElementById(x);async function update(){try{const a=await(await fetch('/state')).json(),p=a.PROGRESS||{};if(!['BASELINE_AUTHOR_DEFAULTS_V1','BASELINE_SIX_V1'].includes(p.version))return;$('stage').textContent={WAITING_UPLOAD:'等待交付',PREPARED:'执行链已准备',PREFLIGHT:'真实预检运行中',FORMAL_RUNNING:'正式训练 / 排队 / 评价',COMPLETE:'六个基线已完成，等待验收',STOP:'预检停止',METHOD_STOP:'部分方法停止，请查看原因'}[p.stage]||p.stage;$('overall').max=p.total||6;$('overall').value=p.done||0;$('detail').textContent='预检作业 '+(p.preflight_job?.job_id||p.job_id||'尚未提交')+' · '+(p.detail?.detail||p.preflight_error?.error||p.error?.error||'');$('methods').replaceChildren(...Object.entries(p.methods||{}).map(([n,m])=>{const a=document.createElement('article'),h=document.createElement('h3'),t=document.createElement('p'),b=document.createElement('progress');h.textContent=n+' · '+({RESOURCE_CHECK:'整轮资源检查',TRAINING_OR_EVALUATING:'正式训练 / 评价',WAITING_GATE:'等待共享预检',SUBMITTED:'已提交 / 排队',COMPLETE:'已完成',RUNNING:'运行中',STOP:'停止，需排查'}[m.stage]||m.stage)+' · 作业 '+(m.job?.job_id||'待预检');t.textContent=(m.detail?.detail||'')+' '+(m.detail?.done??'')+'/'+(m.detail?.total??'')+(m.error?' · '+JSON.stringify(m.error):'');b.max=m.detail?.total||1;b.value=m.detail?.done||0;a.append(h,t,b);if(m.subjobs){for(const [name,v] of Object.entries(m.subjobs)){const line=document.createElement("p");line.textContent=name+" · 作业 "+(v.job?.job_id||"待提交")+" · "+(v.detail?.detail||v.scheduler?.split("|")[1]||"等待依赖")+" "+(v.detail?.done??"")+"/"+(v.detail?.total??"");a.append(line)}}return a}));$('pending').replaceChildren(...Object.entries(p.pending_methods||{}).map(([n,m])=>{const a=document.createElement('p');a.textContent=n+'：'+m.gate;return a}));$('updated').textContent='更新：'+new Date((p.updated_unix||0)*1000).toLocaleString();if(Date.now()/1000-(p.updated_unix||0)>90){$('stage').textContent='进度连接中断：下方为最后记录，不代表当前仍在排队'}}catch(e){$('stage').textContent='本地状态暂不可达'}}update();setInterval(update,5000)</script></html>
